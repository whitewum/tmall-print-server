name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java-http-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tests/selection/run.py
      - run: python3 tests/http/run_tests.py
